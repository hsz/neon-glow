settings.displayName=Neon Glow
settings.enabled=Enable glow
settings.enabled.comment=Turn all text and icon glow on or off without changing your theme or individual glow settings.
settings.targets=Apply Glow To
settings.editorText=Editor text
settings.editorText.comment=Glow behind text in editors, consoles, diffs and gutters. Turn off to restore original text rendering in these areas.
settings.uiText=UI text
settings.uiText.comment=Glow behind text in tool windows, tabs, menus, popups and dialogs. Turn off to restore original text rendering in the IDE interface.
settings.regularText=Regular text glow
settings.regularText.comment=Same-colour halos for text not handled by Neon text styling, including neutral or muted text, in both editor and UI. Turn off to keep this text crisp. With Neon text styling off, this controls all text glow; icons are unaffected.
settings.icons=Icons
settings.icons.comment=Same-colour glow behind icons throughout the IDE. Independent of Regular text glow and Neon text styling; original icon colours are preserved.
settings.synthwaveStyle=Neon text styling
settings.synthwaveStyle.comment=Adds layered neon halos to eligible coloured text in enabled editor and UI areas. Eligibility depends on colour and background contrast, not syntax role: colourful comments can glow too. On dark backgrounds, letters may be tinted; on light backgrounds, their original colours are preserved. Other text, or text with an unknown background, follows Regular text glow. Does not switch your theme or affect icons.
settings.brightness=Brightness:
settings.brightness.min=Transparent
settings.brightness.max=Full
settings.brightness.comment=Halo opacity from 0 to 100%. Style mode varies upstream/adaptive coloured layers; upstream pink's 20% layers and dark bases stay fixed. Zero restores all original rendering, including text cores.
settings.radius=Radius:
settings.radius.min=Tight
settings.radius.max=Wide
settings.radius.comment=How far the halo reaches beyond the glyph or icon, in pixels. Style mode uses reference layer sizes at 6 px; other values scale all layers proportionally.
settings.intensity=Intensity:
settings.intensity.min=Faint
settings.intensity.max=Neon
settings.intensity.comment=Amplifies blurred coverage before brightness is applied. Thin fonts need more intensity than bold ones.
settings.powerSave.comment=All original rendering, including text cores, is restored while Power Save mode is on.
settings.advanced=Fine-Tune Glow
settings.strength.editor=Editor strength:
settings.strength.editor.comment=Scales text halos in editors, consoles, diffs and gutters independently of UI text and icons. Combines with Brightness; 100% keeps the configured halo opacity, while 0% restores original text rendering, including letter colours.
settings.strength.ui=UI strength:
settings.strength.ui.comment=Scales text halos in tool windows, tabs, menus, popups and dialogs independently of editor text and icons. Combines with Brightness; 100% keeps the configured halo opacity, while 0% restores original text rendering, including letter colours.
settings.strength.icons=Icon strength:
settings.strength.icons.comment=Scales icon halos throughout the IDE independently of text glow. Combines with Brightness; 100% keeps the configured halo opacity, while 0% removes icon halos. Original icon colours stay unchanged.
settings.strength.min=Off
settings.strength.max=Full
settings.performanceMode=Performance mode
settings.performanceMode.comment=Limits new glow masks generated during each paint to reduce pauses. Cached glow remains available; some new halos may appear on a later repaint.
settings.support.title=Support Neon Glow
settings.support.comment=Neon Glow is free and open source. If you find it useful, you can support its development via <a href="https://github.com/sponsors/hsz">GitHub Sponsors</a>, <a href="https://ko-fi.com/hszanowski">Ko-fi</a>, or <a href="https://paypal.me/hsz">PayPal</a>, or explore more projects on <a href="https://github.com/hsz">GitHub</a>.
