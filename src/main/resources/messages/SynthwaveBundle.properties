settings.displayName=Synthwave
settings.enabled=Enable glow
settings.enabled.comment=Text and icons in editors, tool windows, tabs, menus, popups and dialogs get blurred halos in their own colours by default.
settings.targets=Apply Glow To
settings.editorText=Editor text (including consoles, diffs and gutters)
settings.uiText=UI text (tool windows, tabs, menus, popups and dialogs)
settings.regularText=Regular text glow
settings.regularText.comment=Same-colour glow for text without SynthWave styling, in both editor and UI. Turn off to keep this text crisp. With SynthWave-style text off, this disables all text glow; icons are unaffected.
settings.icons=Icons
settings.synthwaveStyle=SynthWave '84-style text
settings.synthwaveStyle.comment=Keep your theme. Eligible coloured text gets layered halos: tinted cores on dark backgrounds, original cores on light backgrounds. Other text follows Regular text glow. Icons are unchanged. Try brightness 45%, intensity 100% and radius 6 px, then Apply/OK.
settings.brightness=Brightness:
settings.brightness.min=Transparent
settings.brightness.max=Full
settings.brightness.comment=Halo opacity from 0 to 100%. Style mode varies upstream/adaptive coloured layers; upstream pink's 20% layers and dark bases stay fixed. Zero restores all original rendering, including text cores.
settings.radius=Radius:
settings.radius.min=Tight
settings.radius.max=Wide
settings.radius.comment=How far the halo reaches beyond the glyph or icon, in pixels. Style mode uses reference layer sizes at 6 px; other values scale all layers proportionally.
settings.intensity=Intensity:
settings.intensity.min=Faint
settings.intensity.max=Neon
settings.intensity.comment=Amplifies blurred coverage before brightness is applied. Thin fonts need more intensity than bold ones.
settings.powerSave.comment=All original rendering, including text cores, is restored while Power Save mode is on.
settings.preset.label=Glow preset:
settings.preset.choose=Choose a preset...
settings.preset.classic=Classic
settings.preset.neon=Neon
settings.preset.focus=Focus
settings.preset.accessible=Accessible
settings.preset.comment=Choosing a preset fills the controls below immediately. Customize them freely; Apply or OK changes the IDE. Reset discards unapplied changes; the preset name is not saved.
settings.preset.theme.comment=Select bundled Synthwave themes separately under Appearance. Glow presets do not switch the IDE theme or colour scheme.
settings.advanced=Fine-Tune Glow
settings.strength.editor=Editor strength:
settings.strength.ui=UI strength:
settings.strength.icons=Icon strength:
settings.strength.min=Off
settings.strength.max=Full
settings.strength.comment=Independent strengths from 0 to 100% for each target, in addition to global brightness. Zero restores that target's original rendering.
settings.performanceMode=Performance mode
settings.performanceMode.comment=Limits new glow masks generated during each paint to reduce pauses. Cached glow remains available; some new halos may appear on a later repaint.
settings.preview.show=Show draft preview
settings.preview.accessibleName=Draft glow preview: editor text, UI text and icons
settings.preview.comment=Optional static sample of the current controls, not the live IDE. Previewing does not apply settings or change the theme.
